    <style>
      :root {
        --site-header-height: 56px;

        --font-display: 'Space Grotesk', 'Gill Sans', sans-serif;

        --surface: #11151c;
        --surface-2: #171c25;
        --surface-hover: #1f2530;
        --border: #262c38;
        --border-strong: #333b4a;
        --text-primary: #f1f4f8;
        --text-secondary: #9aa4b5;
        --text-muted: #626d80;
        --accent: #ef4444;
        --accent-hover: #f87171;
        --accent-contrast: #ffffff;
        --accent-bg: rgba(239, 68, 68, 0.12);
      }

      :root[data-theme="light"] {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --surface-hover: #e2e8f0;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --accent: #dc2626;
        --accent-hover: #b91c1c;
        --accent-contrast: #ffffff;
        --accent-bg: rgba(220, 38, 38, 0.08);
      }

      html {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background: var(--bg);
      }

      body {
        background: var(--bg);
        color: var(--text-primary);
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        height: var(--site-header-height);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
        box-sizing: border-box;
      }
      .site-header-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
      }
      .site-header-logo {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .site-header-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text-primary);
        text-decoration: none;
        white-space: nowrap;
      }
      .site-header-nav {

        align-items: center;
        gap: 1.5rem;
        margin-left: auto;
        list-style: none;
        padding: 0;
      }
      .site-header-nav a {

        color: var(--text-secondary);
        font-weight: 500;

        transition: color 0.2s;

      #theme-toggle {

        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        padding: 0;
      }
      #theme-toggle:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }
    </style>

    <script>
      (function() {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;

        function isLight() {
          return document.documentElement.getAttribute("data-theme") === "light";
        }

        function syncButton() {
          if (isLight()) {
            btn.textContent = "☀";
            btn.setAttribute("aria-label", "Switch to dark mode");
          } else {
            btn.textContent = "☾";
            btn.setAttribute("aria-label", "Switch to light mode");
          }
        }

        btn.addEventListener("click", function() {
          if (isLight()) {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
            localStorage.setItem("theme", "light");
          }
          syncButton();
        });

        syncButton();
      })();

      // Clicking the logo should always be a clean slate — without this,
      // restoreFilters() on the archive page falls back to whatever's saved
      // in sessionStorage whenever the URL has no query params, so a "fresh"
      // visit via the logo would silently re-apply your last filters.
      (function() {
        var logo = document.getElementById("site-logo-link");
        if (!logo) return;
        logo.addEventListener("click", function() {
          sessionStorage.removeItem("archiveFilters");
        });
      })();
    </script>
