













<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founding Letters</title>
    
    <meta property="og:title" content="Founding Letters">
    <meta property="og:description" content="Founding Letters Original correspondence from the founders of the vegan movement, preserved here in full alongside scanned copies of the source...">
    <meta property="og:image" content="https://end-animal-use.com/archive/archive/images/paw.webp">
    <meta property="og:url" content="https://end-animal-use.com/letters/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="icon" href="/archive/images/paw.webp" type="image/webp">

    
    <script>
      (function() {
        var saved = localStorage.getItem("theme");
        if (saved === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <style>
      :root {
        --site-header-height: 56px;

        --font-display: 'Space Grotesk', 'Gill Sans', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;

        /* Dark theme (default) */
        --bg: #0a0d12;
        --surface: #11151c;
        --surface-2: #171c25;
        --surface-hover: #1f2530;
        --border: #262c38;
        --border-strong: #333b4a;
        --text-primary: #f1f4f8;
        --text-secondary: #9aa4b5;
        --text-muted: #626d80;
        --accent: #ef4444;
        --accent-hover: #f87171;
        --accent-contrast: #ffffff;
        --accent-bg: rgba(239, 68, 68, 0.12);
      }

      :root[data-theme="light"] {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --surface-hover: #e2e8f0;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --accent: #dc2626;
        --accent-hover: #b91c1c;
        --accent-contrast: #ffffff;
        --accent-bg: rgba(220, 38, 38, 0.08);
      }

      html {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background: var(--bg);
      }

      body {
        background: var(--bg);
        color: var(--text-primary);
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        height: var(--site-header-height);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
        box-sizing: border-box;
      }
      .site-header-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
      }
      .site-header-logo {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .site-header-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text-primary);
        text-decoration: none;
        white-space: nowrap;
      }
      .site-header-nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-left: auto;
        list-style: none;
        padding: 0;
      }
      .site-header-nav a {
        text-decoration: none;
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.9rem;
        transition: color 0.2s;
      }
      .site-header-nav a:hover {
        color: var(--text-primary);
      }
      #theme-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        padding: 0;
      }
      #theme-toggle:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }
    </style>
</head>
<body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="/" id="site-logo-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
          
          <img src="/archive/images/paw.webp" alt="" class="site-header-logo" onerror="this.style.display='none'">
          <span class="site-header-title">End Animal Use</span>
        </a>
        <ul class="site-header-nav">
          <li><a href="/store/">Store</a></li>
          <li><a href="/archive/">Archive</a></li>
          <li><a href="/letters/">Founding Letters</a></li>
          <li><button id="theme-toggle" aria-label="Switch to light mode">☾</button></li>
        </ul>
      </div>
    </header>
    <style>
  .letters-index-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .letters-index-title {
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 0.5rem 0;
  }

  .letters-index-subtitle {
    color: var(--text-secondary);
    margin: 0 0 2rem 0;
    max-width: 640px;
  }

  .author-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    margin-bottom: 0.75rem;
  }
  .author-card:hover {
    border-color: var(--border-strong);
    background: var(--surface-hover);
  }

  .author-card-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .author-card-count {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
</style>

<div class="letters-index-wrapper">
  <h1 class="letters-index-title">Founding Letters</h1>
  <p class="letters-index-subtitle">Original correspondence from the founders of the vegan movement, preserved here in full alongside scanned copies of the source documents.</p>

  
  <a href="/letters/leslie-cross/" class="author-card">
    <span class="author-card-name">Leslie Cross</span>
    <span class="author-card-count">5 letters</span>
  </a>
  
</div>


    <script>
      (function() {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;

        function isLight() {
          return document.documentElement.getAttribute("data-theme") === "light";
        }

        function syncButton() {
          if (isLight()) {
            btn.textContent = "☀";
            btn.setAttribute("aria-label", "Switch to dark mode");
          } else {
            btn.textContent = "☾";
            btn.setAttribute("aria-label", "Switch to light mode");
          }
        }

        btn.addEventListener("click", function() {
          if (isLight()) {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
            localStorage.setItem("theme", "light");
          }
          syncButton();
        });

        syncButton();
      })();

      // Clicking the logo should always be a clean slate — without this,
      // restoreFilters() on the archive page falls back to whatever's saved
      // in sessionStorage whenever the URL has no query params (silently
      // re-applying old filters), and separately the scroll-restore /
      // next-prev logic reads its own saved context from localStorage and
      // would jump straight back to wherever you last were in the gallery.
      // Both need clearing for the logo to be a genuine full reset.
      (function() {
        var logo = document.getElementById("site-logo-link");
        if (!logo) return;
        logo.addEventListener("click", function() {
          sessionStorage.removeItem("archiveFilters");
          localStorage.removeItem("archiveNavContext");
        });
      })();
    </script>
</body>
</html>
