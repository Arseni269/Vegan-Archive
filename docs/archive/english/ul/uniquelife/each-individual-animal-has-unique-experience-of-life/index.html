<script>
// --- GLOBAL STATE ---
let currentIndex = 0;

function updateMainImage(src, isVideo, index) {
    const container = document.getElementById('media-container');
    const thumbs = document.querySelectorAll('.thumb');
    
    container.innerHTML = '';
    currentIndex = index;

    // 1. Wrapper-Div, das IMMER zentriert wird
    const wrapper = document.createElement('div');
    wrapper.style.display = 'block';
    wrapper.style.margin = 'auto';
    wrapper.style.maxWidth = '100%';
    wrapper.style.maxHeight = '70vh';

    // 2. Media-Element erstellen
    const media = isVideo ? document.createElement('video') : document.createElement('img');
    media.src = src;
    media.style.maxWidth = '100%';
    media.style.maxHeight = '70vh';
    media.style.objectFit = 'contain';
    media.style.cursor = 'pointer';
    if (isVideo) media.controls = true;

    // 3. Media in den Wrapper, Wrapper in den Container
    wrapper.appendChild(media);
    container.appendChild(wrapper);

    // Click-Handler bleibt
    container.onclick = () => {
        const isVideo = document.querySelector('#media-container video') !== null;
        if (!isVideo) {
            const galleryItems = Array.from(thumbs).map(thumb => ({
                href: thumb.src,
                type: thumb.tagName.toLowerCase() === 'video' ? 'video' : 'image'
            }));
            window.myLightbox.setElements(galleryItems);
            window.myLightbox.openAt(index);
        }
    };

    // Update thumbnails
    thumbs.forEach(t => t.style.borderColor = 'transparent');
    if (thumbs[index]) {
        thumbs[index].style.borderColor = '#000000';
    }
}
// --- INITIALIZATION ---

    // 0. Post-to-post navigation, respecting whichever filtered set the user
    // came from on the archive page (falls back to just hiding the arrows
    // if there's no context — e.g. a direct link or a shared post). Also
    // points "Back to Archive" at that same origin archive URL (filters and
    // all), which stays correct no matter how many posts get visited
    // afterward via the next/prev arrows below.
    (function setupPostNav() {
        const raw = localStorage.getItem("archiveNavContext");
        if (!raw) return;
        let payload;
        try {
            payload = JSON.parse(raw);
        } catch (e) {
            return;
        }
        const { urls, archiveUrl, savedAt } = payload || {};
        if (!Array.isArray(urls) || urls.length === 0) return;

        const ONE_HOUR_MS = 60 * 60 * 1000;
        if (!savedAt || Date.now() - savedAt > ONE_HOUR_MS) {
            localStorage.removeItem("archiveNavContext");
            return;
        }

        const backLink = document.getElementById("back-to-archive-link");
        if (backLink && archiveUrl) {
            backLink.href = archiveUrl;
        }

        const currentIndex = urls.indexOf(window.location.pathname);
        if (currentIndex === -1) return;

        const navWrapper = document.getElementById("post-nav-arrows");
        const prevLink = document.getElementById("prev-post-link");
        const nextLink = document.getElementById("next-post-link");
        if (!navWrapper || !prevLink || !nextLink) return;

        let shown = false;
        if (currentIndex > 0) {
            prevLink.href = urls[currentIndex - 1];
            prevLink.style.display = "inline";
            prevLink.addEventListener("click", () => {
                payload.clickedUrl = window.location.pathname;
                localStorage.setItem("archiveNavContext", JSON.stringify(payload));
            });
            shown = true;
        }
        if (currentIndex < urls.length - 1) {
            nextLink.href = urls[currentIndex + 1];
            nextLink.style.display = "inline";
            nextLink.addEventListener("click", () => {
                payload.clickedUrl = window.location.pathname;
                localStorage.setItem("archiveNavContext", JSON.stringify(payload));
            });
            shown = true;
        }
        if (shown) navWrapper.style.display = "flex";
    })();

    // 1. Initialize Lightbox
    window.myLightbox = GLightbox({
        loop: true,
        zoomable: false,
        draggable: false,       // "draggable" is GLightbox's mouse-drag-to-pan/navigate option —
                                 // this is what let you grab and move the image with a mouse.
                                 // touchNavigation (left at its default of true) is the separate
                                 // option that handles mobile swipe, so this doesn't affect mobile.
        autoplayVideos: true
    });

    // The zoom icon is a "zoom-in" cursor GLightbox applies to the image, plus (on
    // some slides) a dedicated zoom button — both get (re)applied whenever a slide
    // opens or changes, so strip them on both events rather than just once on open.
    function stripZoomAffordances() {
        document.querySelectorAll('.gslide-media img, .gslide-media video').forEach(el => {
            el.setAttribute('draggable', 'false');
            el.style.cursor = 'default';
            el.style.webkitUserDrag = 'none';
            el.style.userSelect = 'none';
        });
        document.querySelectorAll('.gzoom, .gbtn.gzoom, [class*="gzoom"]').forEach(btn => btn.remove());
    }

    // Add a listener for the lightbox open event
    window.myLightbox.on('open', () => {
    // Select the backdrop/overlay
    const overlay = document.querySelector('.goverlay');
    
    const closeHandler = (e) => {
        // Prevent default browser behavior to ensure it triggers correctly
        e.preventDefault();
        window.myLightbox.close();
    };
    overlay.addEventListener('click', closeHandler, { once: true });
    overlay.addEventListener('touchstart', closeHandler, { once: true });

    stripZoomAffordances();
});
    window.myLightbox.on('slide_changed', stripZoomAffordances);
    // 2. Load first image
    const thumbs = document.querySelectorAll('.thumb');
    if (thumbs.length > 0) {
        const isVideo = thumbs[0].tagName.toLowerCase() === 'video';
        updateMainImage(thumbs[0].src, isVideo, 0);
    }

    // 3. Setup Navigation Listener (arrow keys are a no-op with a single item)
    document.addEventListener('keydown', (e) => {
        const currentThumbs = document.querySelectorAll('.thumb');
        if (currentThumbs.length <= 1) return;
        if (e.key === 'ArrowRight') {
            changeImage(1);
        } else if (e.key === 'ArrowLeft') {
            changeImage(-1);
        }
    });

    // 4. Keep your existing helper functions (Back-to-top, URL linkers, etc.) below this line...
    // ... (Keep your backToTop, auto-hyperlink, and linebreak logic here)
    
});

// --- NEW HELPER FUNCTION ---
function changeImage(direction) {
    const currentThumbs = document.querySelectorAll('.thumb');
    let nextIndex = currentIndex + direction;
    
    // Boundary checks
    if (nextIndex < 0) nextIndex = currentThumbs.length - 1;
    if (nextIndex >= currentThumbs.length) nextIndex = 0;
    
    const isVideo = currentThumbs[nextIndex].tagName.toLowerCase() === 'video';
    updateMainImage(currentThumbs[nextIndex].src, isVideo, nextIndex);
}

    <script>
      (function() {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;

        function isLight() {
          return document.documentElement.getAttribute("data-theme") === "light";
        }

        function syncButton() {
          if (isLight()) {
            btn.textContent = "☀";
            btn.setAttribute("aria-label", "Switch to dark mode");
          } else {
            btn.textContent = "☾";
            btn.setAttribute("aria-label", "Switch to light mode");
          }
        }

        btn.addEventListener("click", function() {
          if (isLight()) {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
            localStorage.setItem("theme", "light");
          }
          syncButton();
        });

        syncButton();
      })();
    </script>
